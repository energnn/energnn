<!-- HTML skeleton of an interactive plot. Placeholders (filled by interactive.py): __UID__ the plot's element id,
     __CSS__ the theme variables and stylesheet, __AUTO_THEME__ 1 when the script must detect the notebook theme,
     __LEGEND__ the legend spans, __SIZE__ the canvas size in pixels, __BODY__ the SVG drawing, __SCRIPT__ plot.js.
     The .view group receives the zoom and pan transform; the toolbar sits over the canvas, outside the SVG. -->
<style>__CSS__</style>
<div id="__UID__" title="scroll to zoom, drag to pan, double-click to reset" data-auto-theme="__AUTO_THEME__">
<div class="lg">__LEGEND__</div>
<div class="cw"><svg class="cv" width="__SIZE__" height="__SIZE__" viewBox="0 0 __SIZE__ __SIZE__"><g class="view">__BODY__</g></svg>
<div class="tb"><button type="button" data-act="zin" title="zoom in">+</button><button type="button" data-act="zout" title="zoom out">&minus;</button><button type="button" data-act="reset" title="reset the view">&#x2302;</button></div></div>
<div class="tip"></div>
<script>__SCRIPT__</script>
</div>
